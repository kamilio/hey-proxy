name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Rust, dashboard, and setup checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: node --test tests/dashboard.cjs
      - name: Verify setup and rollout with local fixtures
        env:
          HEY_PROXY_TEST_BINARY: ${{ github.workspace }}/target/debug/hey-proxy
        run: |
          python3 tests/rollout_macos.py
          python3 tests/rollout_profiles.py
          python3 tests/rollout_transport.py
          python3 tests/rollout_modes.py
          python3 tests/monitor_gemini.py
      - name: Verify source package builds
        run: cargo package --locked
